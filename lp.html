<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/webp" href="1000015120.webp">
<title>صانع صفحات الهبوط الذكي والمطور | ServerNet</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* إعدادات التصميم المتطورة */
*{box-sizing:border-box;scroll-behavior:smooth}
body{margin:0;font-family:'Cairo', sans-serif;color:#fff;background-color:#04080f;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 20px;overflow-x:hidden}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* حاوية منشئ الصفحات الزجاجية النيون */
.builder-container {position:relative;z-index:1;max-width:700px;width:100%;background:rgba(8, 14, 24, 0.8);padding:45px;border-radius:32px;backdrop-filter:blur(20px);border:1px solid rgba(0, 255, 213, 0.25);box-shadow:0 25px 60px rgba(0,0,0,0.6);text-align:right}
.builder-container h2 {color:#00ffd5;margin-top:0;margin-bottom:10px;font-size:28px;text-align:center;font-weight:900;text-shadow: 0 0 15px rgba(0,255,213,0.3)}
.builder-container p.subtitle {color:#a0aec0;text-align:center;margin-bottom:35px;font-size:14px;line-height:1.6}

.form-group {margin-bottom: 22px;}
label{color:#00ffd5;font-size:14px;font-weight:700;display:block;margin-bottom:8px;padding-right:5px}
input, select, textarea{width:100%;padding:16px;border-radius:14px;border:1px solid rgba(255,255,255,0.08);font-size:15px;background:rgba(5, 9, 16, 0.7);color:#fff;font-family:inherit;transition: 0.3s;}
input:focus, select:focus, textarea:focus{outline:none;border-color:#00ffd5;box-shadow:0 0 15px rgba(0,255,213,0.25);background:rgba(5, 9, 16, 0.9)}

/* أزرار التحكم والعمليات */
.btn-grid {display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;}
.action-btn {padding:16px;border-radius:14px;border:0;font-weight:900;font-size:15px;cursor:pointer;transition:0.3s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}

.btn-preview {background: rgba(255, 255, 255, 0.06); color: #fff; border: 1px solid rgba(255,255,255,0.15);}
.btn-preview:hover {background: rgba(255, 255, 255, 0.15); transform: translateY(-2px);}

.btn-generate {background: linear-gradient(135deg,#00ffd5,#00bfa5);color:#070b12;}
.btn-generate:hover {transform:translateY(-2px);box-shadow:0 10px 25px rgba(0,255,213,0.4)}

/* صناديق المخرجات الذكية */
.output-box {margin-top:25px;display:none;background:rgba(0,0,0,0.45);padding:25px;border-radius:20px;border:1px solid rgba(0,255,213,0.3);animation: fadeIn 0.4s ease;}
.output-box h3 {color:#00ffd5;margin-top:0;font-size:18px;margin-bottom:15px}
.tabs-nav {display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;}
.tab-link {background: none; border: 0; color: #a0aec0; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 14px; padding: 5px 10px; transition: 0.2s;}
.tab-link.active {color: #00ffd5; border-bottom: 2px solid #00ffd5;}

.display-area {display: none; background:#0b111a; color:#00ff66; padding:15px; border-radius:12px; font-family:monospace; font-size:13px; word-break:break-all; direction:ltr; text-align:left; border:1px solid #1a2638; margin-bottom:15px; max-height: 200px; overflow-y: auto;}
.display-area.active {display: block;}
.copy-btn {background:#1f2937;color:#fff;border:1px solid rgba(255,255,255,0.1);padding:14px;width:100%;border-radius:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:0.2s}
.copy-btn:hover {background:#00ffd5;color:#070b12}

/* أزرار أسفل الأداة للتواصل */
.contact-group {margin-top: 30px; display: flex; gap: 15px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 25px;}
.nav-btn {flex: 1; padding: 14px; text-align: center; border-radius: 12px; font-weight: 700; text-decoration: none; transition: 0.3s; font-size: 14px;}
.btn-back {background: rgba(255,255,255,0.03); color: #fff; border: 1px solid rgba(255,255,255,0.08);}
.btn-back:hover {background: rgba(255,255,255,0.1);}
.btn-order-now {background: rgba(0, 255, 213, 0.1); color: #00ffd5; border: 1px solid rgba(0, 255, 213, 0.3);}
.btn-order-now:hover {background: #00ffd5; color: #070b12; box-shadow: 0 0 15px rgba(0,255,213,0.4);}

/* 📥 تصميم صفحة الهبوط النهائية والمعاينة الحية */
.view-container {display:none;position:relative;z-index:1;max-width:600px;width:100%;background:rgba(255,255,255,0.02);padding:50px 40px;border-radius:28px;backdrop-filter:blur(20px);text-align:center;box-shadow:0 25px 50px rgba(0,0,0,0.5);animation:fadeIn 0.5s ease}
.view-container h1 {font-size:34px;font-weight:900;margin-top:0;margin-bottom:20px;line-height:1.4}
.view-container p {font-size:16px;color:#a0aec0;line-height:1.8;margin-bottom:35px}
.action-link {display:inline-block;width:100%;max-width:400px;padding:18px;border-radius:16px;font-size:18px;font-weight:900;text-decoration:none;transition:0.3s}
.action-link:hover {transform:translateY(-4px)}
.lp-footer {margin-top:40px;font-size:12px;color:#4a5568}
.lp-product-img {width: 100%; max-width: 290px; border-radius: 20px; margin-bottom: 25px; object-fit: cover; display: none; border: 2px solid rgba(255,255,255,0.1); animation: float 4s ease-in-out infinite;}

/* نافذة المعاينة المنبثقة الصاعدة (Modal) */
.modal-overlay {position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(4,8,15,0.85); z-index:100; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:0.3s; backdrop-filter: blur(10px);}
.modal-overlay.open {opacity:1; pointer-events:auto;}
.modal-content {background: #0a0f1d; border: 1px solid rgba(0,255,213,0.3); width:90%; max-width:550px; border-radius:24px; padding:30px; position:relative; transform:scale(0.9); transition:0.3s; box-shadow:0 20px 50px rgba(0,0,0,0.8)}
.modal-overlay.open .modal-content {transform:scale(1);}
.close-modal {position:absolute; top:20px; left:20px; background:rgba(255,255,255,0.05); border:0; color:#fff; width:35px; height:35px; border-radius:50%; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.close-modal:hover {background: #ef4444;}

@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes fadeIn { from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }
@media(max-width:768px){ .builder-container, .view-container { padding:30px 20px; } .btn-grid, .contact-group {grid-template-columns: 1fr; flex-direction: column; gap: 12px;} }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="builder-container" id="builderInterface">
    <h2>🛠️ منشئ صفحات الهبوط السحابي الاحترافي</h2>
    <p class="subtitle">أنشئ واجهات تسويقية فائقة الجاذبية لمنتجاتك وقنواتك مع ميزة المعاينة الفورية واستخراج الأكواد.</p>
    
    <form id="generatorForm">
        <div class="form-group">
            <label>عنوان الصفحة التسويقي:</label>
            <input type="text" id="lpTitle" placeholder="مثال: أكاديمية النخبة لتوصيات ومؤشرات الأسهم" required>
        </div>
        
        <div class="form-group">
            <label>رابط صورة المنتج / الشعار التوضيحي (اختياري):</label>
            <input type="url" id="lpImg" placeholder="https://site.com/image.png (يمكن تركه فارغاً)">
        </div>

        <div class="form-group">
            <label>الوصف التسويقي للخدمة أو العرض:</label>
            <textarea id="lpDesc" rows="3" placeholder="اكتب نصاً جذاباً يشرح ميزات قناتك أو منتجك الرقمي بوضوح..." required></textarea>
        </div>
        
        <div class="form-group">
            <label>رابط الإجراء المستهدف (تليجرام / واتساب / دفع):</label>
            <input type="url" id="lpLink" placeholder="https://t.me/your_channel" required>
        </div>
        
        <div class="form-group">
            <label>النص المكتوب داخل زر الاشتراك:</label>
            <input type="text" id="lpBtnText" placeholder="مثال: انضم الآن مجاناً وابدأ الاستثمار 🚀" required>
        </div>
        
        <div class="form-group">
            <label>الهوية اللونية والمظهر:</label>
            <select id="lpColor" required>
                <option value="#00ffd5">الأخضر النيون السايبير (ServerNet)</option>
                <option value="#0088cc">الأزرق الاحترافي (Telegram Style)</option>
                <option value="#ff9900">الذهبي الاستثماري (Crypto Gold)</option>
                <option value="#e91e63">الوردي الفاخر (VIP Premium)</option>
            </select>
        </div>
        
        <div class="btn-grid">
            <button type="button" onclick="openLivePreview()" class="action-btn btn-preview">👁️ معاينة حية للمظهر</button>
            <button type="button" onclick="generateLpAssets()" class="action-btn btn-generate">⚡ توليد الرابط والأكواد</button>
        </div>
    </form>

    <div class="output-box" id="outputBox">
        <h3>🎉 جاهز! تم تحضير الأصول التسويقية</h3>
        <div class="tabs-nav">
            <button class="tab-link active" onclick="switchTab('urlTab', this)">🔗 رابط السحابة المباشر</button>
            <button class="tab-link" onclick="switchTab('htmlTab', this)">💻 كود HTML مستقل</button>
        </div>
        
        <div id="urlTab" class="display-area active"></div>
        <div id="htmlTab" class="display-area"></div>
        
        <button class="copy-btn" id="copyActionBtn" onclick="copyActiveOutput()">📋 نسخ الرابط السحابي</button>
    </div>

    <div class="contact-group">
        <a href="index.html" class="nav-btn btn-back">⬅️ العودة للرئيسية</a>
        <a href="index.html#order" class="nav-btn btn-order-now">🎯 اطلب صفحتك الخاصة / تواصل معنا</a>
    </div>
</div>

<div class="view-container" id="viewInterface">
    <h1 id="viewTitle"></h1>
    <center><img src="" id="viewProductImg" class="lp-product-img" alt="Product"></center>
    <p id="viewDesc"></p>
    <a href="#" id="viewBtn" target="_blank" class="action-link"></a>
    <div class="lp-footer">تمت الأتمتة والاستضافة عبر <a href="index.html" style="color:#00ffd5; text-decoration:none; font-weight:700;">ServerNet</a></div>
</div>

<div class="modal-overlay" id="previewModal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeLivePreview()">✕</button>
        <h4 style="color: #a0aec0; margin-top:0; text-align:center; font-size:14px; margin-bottom:20px;">👁️ شاشة معاينة مظهر العميل الفورية</h4>
        <div style="background: rgba(255,255,255,0.02); padding: 30px 20px; border-radius: 18px; text-align: center; border: 1px dashed rgba(255,255,255,0.1);" id="modalInnerView">
            <h2 id="modalTitle" style="font-size: 24px; font-weight: 900; margin-bottom: 15px;"></h2>
            <center><img src="" id="modalImg" style="width:100%; max-width:200px; border-radius:12px; margin-bottom:15px; display:none; border: 1px solid rgba(255,255,255,0.1)"></center>
            <p id="modalDesc" style="font-size: 14px; color:#a0aec0; line-height: 1.6; margin-bottom:25px;"></p>
            <a href="#" id="modalBtn" onclick="return false;" class="action-link" style="font-size: 15px; padding: 14px;"></a>
        </div>
    </div>
</div>

<script>
/* كود الـ Canvas الخلفية المتحركة */
const canvas=document.getElementById('bg'); const ctx=canvas.getContext('2d');
function resize() { canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
resize(); window.addEventListener('resize', resize);
const lines=[]; for(let i=0;i<30;i++){ lines.push({x1:Math.random()*canvas.width,y1:Math.random()*canvas.height,x2:Math.random()*canvas.width,y2:Math.random()*canvas.height,dx:(Math.random()-0.5)*1,dy:(Math.random()-0.5)*1}); }
function animate(){ ctx.fillStyle='rgba(4,8,15,0.15)'; ctx.fillRect(0,0,canvas.width,canvas.height); lines.forEach(l=>{ ctx.beginPath(); ctx.moveTo(l.x1,l.y1); ctx.lineTo(l.x2,l.y2); ctx.strokeStyle='rgba(0,255,213,0.12)'; ctx.lineWidth=1; ctx.stroke(); l.x1+=l.dx; l.y1+=l.dy; l.x2+=l.dx; l.y2+=l.dy; if(l.x1<0||l.x1>canvas.width||l.x2<0||l.x2>canvas.width) l.dx*=-1; if(l.y1<0||l.y1>canvas.height||l.y2<0||l.y2>canvas.height) l.dy*=-1; }); requestAnimationFrame(animate); }
animate();

let activeTab = 'urlTab';

/* فتح وإعداد المعاينة الفورية الحية */
function openLivePreview() {
    const title = document.getElementById('lpTitle').value || "عنوان تجريبي للصفحة";
    const imgUrl = document.getElementById('lpImg').value;
    const desc = document.getElementById('lpDesc').value || "وصف تجريبي مخصص يظهر هنا لعملائك.";
    const btnText = document.getElementById('lpBtnText').value || "زر الاشتراك التجريبي 🚀";
    const color = document.getElementById('lpColor').value;

    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalTitle').style.color = color;
    document.getElementById('modalDesc').innerText = desc;
    
    const mBtn = document.getElementById('modalBtn');
    mBtn.innerText = btnText;
    mBtn.style.background = color;
    mBtn.style.color = (color === '#00ffd5' || color === '#ff9900') ? '#070b12' : '#fff';
    mBtn.style.boxShadow = `0 8px 20px ${color}30`;

    const mImg = document.getElementById('modalImg');
    if(imgUrl && imgUrl.trim() !== "") {
        mImg.src = imgUrl;
        mImg.style.display = 'block';
    } else {
        mImg.style.display = 'none';
    }

    document.getElementById('previewModal').classList.add('open');
}

function closeLivePreview() {
    document.getElementById('previewModal').classList.remove('open');
}

/* ⚙️ معالجة الأصول (الروابط + أكواد HTML المستقلة) ⚙️ */
function generateLpAssets() {
    const title = document.getElementById('lpTitle').value;
    const imgUrl = document.getElementById('lpImg').value;
    const desc = document.getElementById('lpDesc').value;
    const link = document.getElementById('lpLink').value;
    const btnText = document.getElementById('lpBtnText').value;
    const color = document.getElementById('lpColor').value;

    if(!title || !desc || !link || !btnText) {
        alert("الرجاء إكمال كافة الحقول الأساسية أولاً.");
        return;
    }

    // 1. توليد الرابط المشفر السحابي
    const dataObject = { t: title, i: imgUrl, d: desc, l: link, b: btnText, c: color };
    const jsonString = JSON.stringify(dataObject);
    const encodedData = btoa(unescape(encodeURIComponent(jsonString)));
    const currentUrl = window.location.href.split('#')[0];
    const finalGeneratedUrl = `${currentUrl}#data=${encodedData}`;

    document.getElementById('urlTab').innerText = finalGeneratedUrl;

    // 2. توليد كود HTML المتكامل المستقل للعميل
    const generatedHtmlCode = `<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${title}</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; scroll-behavior: smooth; }
  body { margin: 0; font-family: 'Cairo', sans-serif; color: #fff; background-color: #050911; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
  .card { max-width: 550px; width: 100%; background: rgba(255,255,255,0.02); padding: 50px 35px; border-radius: 24px; text-align: center; border: 1px solid ${color}30; box-shadow: 0 20px 45px rgba(0,0,0,0.6); backdrop-filter: blur(15px); }
  h1 { font-size: 32px; font-weight: 900; color: #fff; margin-top: 0; margin-bottom: 20px; }
  h1 span { color: ${color}; }
  p { font-size: 16px; color: #a0aec0; line-height: 1.8; margin-bottom: 35px; }
  .btn { display: inline-block; width: 100%; max-width: 380px; padding: 16px; border-radius: 14px; font-size: 17px; font-weight: 900; text-decoration: none; background: ${color}; color: ${(color === '#00ffd5' || color === '#ff9900') ? '#070b12' : '#fff'}; box-shadow: 0 10px 25px ${color}40; transition: 0.3s; }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 30px ${color}60; }
  .img { width: 100%; max-width: 260px; border-radius: 16px; margin-bottom: 25px; object-fit: cover; border: 1px solid ${color}40; }
</style>
</head>
<body>
  <div class="card">
    <h1>${title}</h1>
    ${imgUrl ? `<img src="${imgUrl}" class="img">` : ''}
    <p>${desc}</p>
    <a href="${link}" class="btn" target="_blank">${btnText}</a>
  </div>
</body>
</html>`;

    document.getElementById('htmlTab').innerText = generatedHtmlCode;

    // إظهار النتائج للعميل
    document.getElementById('outputBox').style.display = 'block';
    document.getElementById('outputBox').scrollIntoView({ behavior: 'smooth' });
}

/* التبديل التفاعلي بين التبويبات */
function switchTab(tabId, btn) {
    activeTab = tabId;
    document.querySelectorAll('.display-area').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-link').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');

    const actionBtn = document.getElementById('copyActionBtn');
    if(tabId === 'urlTab') {
        actionBtn.innerText = "📋 نسخ الرابط السحابي";
        actionBtn.style.background = "#1f2937";
        actionBtn.style.color = "#fff";
    } else {
        actionBtn.innerText = "💾 نسخ كود HTML المخصص";
        actionBtn.style.background = "#00ffd5";
        actionBtn.style.color = "#070b12";
    }
}

function copyActiveOutput() {
    const copyText = document.getElementById(activeTab).innerText;
    navigator.clipboard.writeText(copyText);
    alert(activeTab === 'urlTab' ? "✅ تم نسخ رابط صفحة الهبوط السحابية!" : "✅ تم نسخ كود HTML المستقل بالكامل لتطبيقاتك المخصصة!");
}

/* 👁️ فحص مسار وهاش الرابط لزوار صفحات الهبوط المستقلة */
function checkRouting() {
    const hash = window.location.hash;
    if (hash && hash.startsWith('#data=')) {
        try {
            const encodedData = hash.replace('#data=', '');
            const decodedString = decodeURIComponent(escape(atob(encodedData)));
            const data = JSON.parse(decodedString);

            document.getElementById('builderInterface').style.display = 'none';
            const view = document.getElementById('viewInterface');
            view.style.display = 'block';

            document.getElementById('viewTitle').innerHTML = `<span>${data.t.split(' ')[0]}</span> ${data.t.substring(data.t.indexOf(' ') + 1)}`;
            document.getElementById('viewTitle').style.color = '#fff';
            document.querySelector('#viewInterface h1 span').style.color = data.c;
            document.getElementById('viewDesc').innerText = data.d;
            
            const imgElement = document.getElementById('viewProductImg');
            if(data.i && data.i.trim() !== "") {
                imgElement.src = data.i;
                imgElement.style.display = 'block';
                imgElement.style.borderColor = data.c + '40';
                imgElement.style.boxShadow = `0 15px 40px ${data.c}20`;
            } else {
                imgElement.style.display = 'none';
            }

            const btn = document.getElementById('viewBtn');
            btn.innerText = data.b;
            btn.href = data.l;
            btn.style.background = data.c;
            btn.style.color = (data.c === '#00ffd5' || data.c === '#ff9900') ? '#070b12' : '#fff';
            btn.style.boxShadow = `0 10px 30px ${data.c}40`;
            
            document.title = data.t;
            view.style.border = `1px solid ${data.c}30`;

        } catch (e) {
            console.error("خطأ التوجيه:", e);
            document.getElementById('builderInterface').style.display = 'block';
        }
    } else {
        document.getElementById('builderInterface').style.display = 'block';
        document.getElementById('viewInterface').style.display = 'none';
    }
}

window.addEventListener('DOMContentLoaded', checkRouting);
window.addEventListener('hashchange', checkRouting);
</script>
</body>
</html>
