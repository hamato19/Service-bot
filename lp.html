<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قوالب صفحات الهبوط | Service Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* التمويه والألوان المتطابقة مع الهوية الرئيسية للموقع */
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131c2e;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --free-color: #10b981;
            --premium-color: #f59e0b;
            --border-color: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 60px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* أزرار الفلترة المتناسقة مع ستايل الموقع */
        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 45px;
        }

        .filter-btn {
            padding: 10px 24px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--bg-card);
            color: var(--text-main);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        /* شبكة القوالب بستايل كروت الخدمة الأصلية */
        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        /* كرت القالب المطابق للرئيسية */
        .template-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .template-card:hover {
            transform: translateY(-5px);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* الشارات فوق الصورة */
        .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            color: white;
            z-index: 10;
            letter-spacing: 0.5px;
        }

        .badge.free { background-color: var(--free-color); }
        .badge.premium { background-color: var(--premium-color); }

        /* منطقة المعاينة الصورية للكرت */
        .template-preview {
            width: 100%;
            height: 190px;
            background-color: #1e293b;
            background-size: cover;
            background-position: top center;
            border-bottom: 1px solid var(--border-color);
        }

        .template-info {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .template-info h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .template-info p {
            font-size: 0.90rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.6;
            flex-grow: 1;
        }

        /* أزرار التحكم والروابط أسفل الكرت */
        .card-actions {
            display: flex;
            gap: 12px;
            margin-top: auto;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-demo {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-demo:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .btn-use {
            background-color: var(--primary);
            color: white;
        }

        .btn-use:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>متجر قوالب صفحات الهبوط</h1>
        <p>اختر من بين مجموعة قوالب احترافية مجهزة ومؤتمتة بالكامل لبدء نشاطك</p>
    </header>

    <div class="filter-buttons">
        <button class="filter-btn active" onclick="filterTemplates('all')">الكل</button>
        <button class="filter-btn" onclick="filterTemplates('free')">المجانية</button>
        <button class="filter-btn" onclick="filterTemplates('premium')">المدفوعة <i class="fa-solid fa-crown" style="color: var(--premium-color); margin-right: 4px;"></i></button>
    </div>

    <div class="templates-grid" id="templatesGrid">
        </div>
</div>

<script>
    // مصفوفة بيانات القوالب - قم بتعديل الروابط والصور بناءً على قوالبك الفلعرية
    const templates = [
        {
            id: 'free_lead',
            title: 'قالب جمع البيانات السريع',
            description: 'قالب خفيف متناسق وممتاز لجمع بيانات العملاء المهتمين واستهدافهم برمجياً لاحقاً.',
            type: 'free',
            previewImage: 'https://via.placeholder.com/400x200/131c2e/94a3b8?text=Lead+Generation',
            demoUrl: '#',
            useUrl: '#'
        },
        {
            id: 'premium_salla',
            title: 'قالب المنتجات الرقمية الاحترافي',
            description: 'يحتوي على عداد تنازلي ذكي، قسم مراجعات تفاعلي، مجهز بالكامل لربط الـ Webhooks والدفع.',
            type: 'premium',
            previewImage: 'https://via.placeholder.com/400x200/131c2e/94a3b8?text=Digital+Products',
            demoUrl: '#',
            useUrl: '#'
        },
        {
            id: 'free_whatsapp',
            title: 'قالب تحويل الواتساب الفوري',
            description: 'صفحة هبوط مركزة ومباشرة ومصممة خصيصاً لتوجيه العميل إلى شات الواتساب بنصوص مسبقة الإعداد.',
            type: 'free',
            previewImage: 'https://via.placeholder.com/400x200/131c2e/94a3b8?text=WhatsApp+Direct',
            demoUrl: '#',
            useUrl: '#'
        },
        {
            id: 'premium_landing',
            title: 'قالب تسويق الخدمات المتكامل',
            description: 'قالب مخصص لأصحاب الخدمات الرقمية مدمج به تتبع البكسل (Pixel Tracking) لعائد إعلاني أعلى.',
            type: 'premium',
            previewImage: 'https://via.placeholder.com/400x200/131c2e/94a3b8?text=Premium+Services',
            demoUrl: '#',
            useUrl: '#'
        }
    ];

    function renderTemplates(data) {
        const grid = document.getElementById('templatesGrid');
        grid.innerHTML = '';

        data.forEach(tmpl => {
            const isFree = tmpl.type === 'free';
            const card = document.createElement('div');
            card.className = `template-card`;

            card.innerHTML = `
                <span class="badge ${tmpl.type}">${isFree ? 'مجاني' : 'مدفوع نُخبة'}</span>
                <div class="template-preview" style="background-image: url('${tmpl.previewImage}')"></div>
                <div class="template-info">
                    <h3>${tmpl.title}</h3>
                    <p>${tmpl.description}</p>
                    <div class="card-actions">
                        <a href="${tmpl.demoUrl}" class="btn btn-demo" target="_blank"><i class="fa-solid fa-eye"></i> معاينة</a>
                        <a href="${tmpl.useUrl}" class="btn btn-use">${isFree ? '<i class="fa-solid fa-bolt"></i> استخدام مجاني' : '<i class="fa-solid fa-credit-card"></i> شراء وتفعيل'}</a>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function filterTemplates(type) {
        const buttons = document.querySelectorAll('.filter-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        if (type === 'all') {
            renderTemplates(templates);
        } else {
            const filtered = templates.filter(t => t.type === type);
            renderTemplates(filtered);
        }
    }

    // التشغيل المبدئي
    renderTemplates(templates);
</script>
</body>
</html>
