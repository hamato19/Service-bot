<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <script src="protection.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServerNet | لوحة تحكم ونشر القوالب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        * { box-sizing: border-box; scroll-behavior: smooth; }
        body { margin: 0; font-family: 'Cairo', sans-serif; color: #fff; background-color: #070b12; overflow-x: hidden; }
        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        header { position: fixed; top: 0; width: 100%; background: rgba(7,11,18,0.8); backdrop-filter: blur(10px); z-index: 10; border-bottom: 1px solid rgba(0,255,213,0.1); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }
        .logo { font-size: 22px; font-weight: 900; color: #00ffd5; text-decoration: none; }
        .logo span { color: #fff; }
        .nav-links a { color: #fff; text-decoration: none; margin-right: 20px; font-size: 14px; font-weight: 700; transition: 0.3s; }
        .nav-links a:hover { color: #00ffd5; }

        .dashboard-container { position: relative; z-index: 1; padding: 120px 20px 60px; max-width: 1200px; margin: 0 auto; display: flex; gap: 30px; }
        .control-panel { flex: 1; background: rgba(0,0,0,0.5); padding: 30px; border-radius: 24px; border: 1px solid rgba(0,255,213,0.15); backdrop-filter: blur(15px); text-align: right; }
        .control-panel h2 { color: #00ffd5; margin-top: 0; margin-bottom: 25px; font-size: 22px; font-weight: 900; border-bottom: 1px solid rgba(0,255,213,0.1); padding-bottom: 10px; }
        
        label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; color: #e2e8f0; }
        input, select, textarea { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; font-size: 14px; background: rgba(7,11,18,0.7); color: #fff; font-family: inherit; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #00ffd5; box-shadow: 0 0 10px rgba(0,255,213,0.2); }
        
        .generate-btn { width: 100%; padding: 15px; border-radius: 12px; border: 0; background: linear-gradient(135deg,#00ffd5,#00bfa5); color: #070b12; font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.3s; font-family: inherit; }
        .generate-btn:hover { transform: scale(1.02); box-shadow: 0 10px 25px rgba(0,255,213,0.3); }

        .preview-panel { flex: 1.2; display: flex; flex-direction: column; gap: 20px; }
        .result-box { background: rgba(10, 17, 28, 0.7); border: 1px dashed rgba(0, 255, 213, 0.3); padding: 25px; border-radius: 24px; text-align: right; display: none; animation: fadeIn 0.4s ease; }
        .result-box h3 { color: #00ffd5; margin-top: 0; font-size: 18px; }
        .url-display { background: #111; color: #00ff66; padding: 12px; border-radius: 10px; font-family: monospace; font-size: 13px; direction: ltr; text-align: left; overflow-x: auto; border: 1px solid #222; margin-bottom: 15px; white-space: nowrap; }
        
        .action-btns { display: flex; gap: 10px; }
        .btn-action { flex: 1; padding: 12px; text-align: center; border-radius: 10px; font-weight: 700; text-decoration: none; cursor: pointer; transition: 0.2s; font-family: inherit; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-copy { background: #242f3d; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .btn-visit { background: #00ffd5; color: #070b12; border: 0; }

        .iframe-wrapper { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; height: 500px; }
        .iframe-header { background: #182533; padding: 12px 20px; text-align: right; font-size: 13px; font-weight: 700; color: #a0aec0; display: flex; justify-content: space-between; align-items: center; }
        .live-iframe { width: 100%; height: 100%; border: 0; background: #fff; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media(max-width:992px) { .dashboard-container { flex-direction: column; padding-top: 100px; } }
    </style>
</head>
<body>

<canvas id="bg"></canvas>

<header>
    <div class="nav-container">
        <a href="index.html" class="logo">SERVER<span>NET</span></a>
        <div class="nav-links">
            <a href="index.html#features">تقنيات التداول</a>
            <a href="lp.html">متجر القوالب</a>
            <a href="#" style="color:#00ffd5;">لوحة التحكم</a>
            <a href="index.html#order">اطلب بوتك المالي</a>
        </div>
    </div>
</header>

<div class="dashboard-container">
    
    <div class="control-panel">
        <h2><i class="fa-solid fa-cloud-upload-alt" style="color: #00ffd5; margin-left: 10px;"></i> نشر قالب جديد في المتجر</h2>
        <form id="generatorForm" onsubmit="publishTemplate(event)">
            
            <label for="templateId">معرّف القالب الفريد (ID بالإنجليزية):</label>
            <input type="text" id="templateId" placeholder="مثال: vip_crypto_page" required>

            <label for="templateTitle">اسم القالب (يظهر في المتجر):</label>
            <input type="text" id="templateTitle" placeholder="مثال: قالب اشتراكات الكريبتو الاحترافي" required oninput="updateLivePreview()">

            <label for="templateDesc">وصف القالب التسويقي الخارجي (في المتجر):</label>
            <textarea id="templateDesc" rows="2" placeholder="اكتب وصفاً موجزاً لجذب المشترين..." required></textarea>

            <label for="pageTemplate">نوع القالب والتصميم الداخلي:</label>
            <select id="pageTemplate" required onchange="updateLivePreview()">
                <option value="free">قالب مجاني (ثيم أزرق - اقتناص إشارات)</option>
                <option value="premium">قالب النخبة المدفوع (ثيم فخم - عداد تنازلي وآراء)</option>
            </select>

            <label for="templateImage">رابط صورة المعاينة (Preview Image):</label>
            <input type="url" id="templateImage" placeholder="أدخل رابط صورة كفر القالب" value="https://via.placeholder.com/400x200/070b12/00ffd5?text=ServerNet+Template">

            <label for="pageTitle">العنوان الداخلي لصفحة العميل (Title):</label>
            <input type="text" id="pageTitle" value="أكاديمية النخبة للتداول" required oninput="updateLivePreview()">

            <label for="pageDesc">الرسالة التسويقية الداخلية المخصصة للعميل:</label>
            <textarea id="pageDesc" rows="2" required oninput="updateLivePreview()">احصل على أقوى الاستراتيجيات فوراً وعرض حصري ينتهي قريباً! 🔥</textarea>

            <label for="pagePhone">رقم الواتساب الافتراضي للتواصل:</label>
            <input type="tel" id="pagePhone" value="966500000000" required oninput="updateLivePreview()">

            <label for="pageMsg">رسالة الواتساب الجاهزة:</label>
            <input type="text" id="pageMsg" value="مرحباً، أريد الاشتراك في المنظومة المالي" required oninput="updateLivePreview()">

            <button type="submit" class="generate-btn"><i class="fa-solid fa-paper-plane"></i> نشر القالب فوراً في المتجر</button>
        </form>
    </div>

    <div class="preview-panel">
        <div class="result-box" id="resultBox">
            <h3><i class="fa-solid fa-circle-check" style="color: #00ff66; margin-left: 8px;"></i> تم النشر التلقائي بنجاح!</h3>
            <p style="color: #a0aec0; font-size: 13px; margin-bottom: 10px;">تمت إضافة القالب لمتجر القوالب (lp.html) بنجاح دون تعديل أكواد. رابط المعاينة المباشر:</p>
            <div class="url-display" id="finalUrlDisplay"></div>
            <div class="action-btns">
                <button class="btn-action btn-copy" onclick="copyLink()"><i class="fa-solid fa-copy"></i> نسخ الرابط</button>
                <a href="lp.html" class="btn-action btn-visit"><i class="fa-solid fa-store"></i> الانتقال للمتجر لرؤيته</a>
            </div>
        </div>

        <div class="iframe-wrapper">
            <div class="iframe-header">
                <div><span>شاشة المحاكاة والمعاينة الحية للفكرة</span></div>
                <div style="font-size: 11px; color:#00ffd5;"><i class="fa-solid fa-rotate"></i> تحديث تلقائي</div>
            </div>
            <iframe id="livePreviewIframe" class="live-iframe" src=""></iframe>
        </div>
    </div>

</div>

<script>
/* أنيميشن Canvas المتطابق للشبكة */
const canvas = document.getElementById('bg'); const ctx = canvas.getContext('2d');
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas(); window.addEventListener('resize', resizeCanvas);
const lines = [];
for(let i=0; i<35; i++){ lines.push({x1:Math.random()*canvas.width, y1:Math.random()*canvas.height, x2:Math.random()*canvas.width, y2:Math.random()*canvas.height, dx:(Math.random()-0.5)*1.2, dy:(Math.random()-0.5)*1.2}); }
function animate(){ ctx.fillStyle = 'rgba(7,11,18,0.15)'; ctx.fillRect(0,0,canvas.width,canvas.height); lines.forEach(l=>{ ctx.beginPath(); ctx.moveTo(l.x1,l.y1); ctx.lineTo(l.x2,l.y2); ctx.strokeStyle = 'rgba(0,255,213,0.3)'; ctx.lineWidth = 1.2; ctx.stroke(); l.x1+=l.dx; l.y1+=l.dy; l.x2+=l.dx; l.y2+=l.dy; if(l.x1<0||l.x1>canvas.width||l.x2<0||l.x2>canvas.width) l.dx*=-1; if(l.y1<0||l.y1>canvas.height||l.y2<0||l.y2>canvas.height) l.dy*=-1; }); requestAnimationFrame(animate); }
animate();

function buildParamUrl() {
    const template = document.getElementById('pageTemplate').value;
    const title = encodeURIComponent(document.getElementById('pageTitle').value);
    const desc = encodeURIComponent(document.getElementById('pageDesc').value);
    const phone = encodeURIComponent(document.getElementById('pagePhone').value);
    const msg = encodeURIComponent(document.getElementById('pageMsg').value);
    const baseUrl = window.location.href.split('/').slice(0, -1).join('/');
    return `${baseUrl}/template-engine.html?type=${template}&title=${title}&desc=${desc}&phone=${phone}&msg=${msg}`;
}

function updateLivePreview() {
    document.getElementById('livePreviewIframe').src = buildParamUrl();
}
window.onload = updateLivePreview;

// دالة نشر القالب وحفظه تلقائياً ليعرض في بيكاليكا الخاص بـ ServerNet
function publishTemplate(e) {
    e.preventDefault();
    const finalUrl = buildParamUrl();
    
    const newTemplate = {
        id: document.getElementById('templateId').value,
        title: document.getElementById('templateTitle').value,
        description: document.getElementById('templateDesc').value,
        type: document.getElementById('pageTemplate').value,
        previewImage: document.getElementById('templateImage').value,
        demoUrl: finalUrl,
        useUrl: 'index.html#order'
    };

    // جلب القوالب الحالية المضافة مسبقاً أو إنشاء مصفوفة فارغة
    let localTemplates = JSON.parse(localStorage.getItem('servernet_custom_templates')) || [];
    
    // منع تكرار نفس المعرّف، لو موجود يحدثه، لو مو موجود يضيفه
    localTemplates = localTemplates.filter(t => t.id !== newTemplate.id);
    localTemplates.push(newTemplate);
    
    // حفظ في الذاكرة المحلية
    localStorage.setItem('servernet_custom_templates', JSON.stringify(localTemplates));

    document.getElementById('finalUrlDisplay').innerText = finalUrl;
    document.getElementById('resultBox').style.display = 'block';
    document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth' });
}

function copyLink() {
    navigator.clipboard.writeText(document.getElementById('finalUrlDisplay').innerText).then(() => {
        alert('✅ تم نسخ رابط معاينة القالب!');
    });
}
</script>
</body>
</html>
